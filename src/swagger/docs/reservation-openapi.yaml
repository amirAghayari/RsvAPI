components:
  schemas:
    Reservation:
      type: object
      required: [id, userId, ticketId, quantity, status, expiresAt, createdAt]
      properties:
        id:
          type: string
          format: uuid
          example: e5c90b60-c0f6-4a6a-8fbb-1d4d6295e370
        userId:
          type: string
          format: uuid
          example: 6d10c93f-bf3d-4fa6-ae42-4558742c56df
        ticketId:
          type: string
          format: uuid
          example: 7f0623d4-5bd2-40c4-baa4-c0ee50e7a809
        quantity:
          type: integer
          example: 2
        status:
          type: string
          enum: [pending, confirmed, canceled, expired]
          example: pending
        expiresAt:
          type: string
          format: date-time
          example: 2026-07-17T12:30:00.000Z
        createdAt:
          type: string
          format: date-time
          example: 2026-07-17T12:00:00.000Z

    CreateReservationRequest:
      type: object
      required: [ticketId, quantity]
      properties:
        ticketId:
          type: string
          format: uuid
          example: 7f0623d4-5bd2-40c4-baa4-c0ee50e7a809
        quantity:
          type: integer
          minimum: 1
          example: 2

    ReservationListResponse:
      type: object
      properties:
        status:
          type: string
          example: success
        results:
          type: integer
          example: 3
        pagination:
          type: object
          nullable: true
        data:
          type: object
          properties:
            reservations:
              type: array
              items:
                $ref: "#/components/schemas/Reservation"

    ErrorResponse:
      type: object
      required: [status, errors]
      properties:
        status:
          type: string
          example: error
        errors:
          type: array
          items:
            type: object
            required: [message]
            properties:
              field:
                type: string
                nullable: true
                example: null
              message:
                type: string
                example: Something went wrong.

paths:
  /reservations:
    post:
      tags: [Reservation]
      summary: Create a reservation
      description: |
        Creates a pending reservation for the current authenticated user. The reservation is validated against event status, ticket sale window, ticket capacity, and user-per-ticket limit.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReservationRequest"
      responses:
        "201":
          description: Reservation created successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      reservation:
                        $ref: "#/components/schemas/Reservation"
        "400":
          description: Bad request due to invalid reservation state, capacity, or business rules.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized.
        "409":
          description: Duplicate pending reservation for the same ticket.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    get:
      tags: [Admin]
      summary: Get all reservations (Admin)
      description: |
        Returns paginated reservation records for administrators only.
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            example: 1
        - in: query
          name: limit
          schema:
            type: integer
            example: 10
        - in: query
          name: sort
          schema:
            type: string
            example: createdAt
      responses:
        "200":
          description: Reservations list fetched successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReservationListResponse"
        "403":
          description: Forbidden. Admin access required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /reservations/me:
    get:
      tags: [Reservation]
      summary: Get my reservations
      description: |
        Returns all reservations belonging to the currently authenticated user.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Reservations fetched successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      reservation:
                        type: array
                        items:
                          $ref: "#/components/schemas/Reservation"
        "401":
          description: Unauthorized.
        "404":
          description: No reservations found for this user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /reservations/status/{status}:
    get:
      tags: [Admin]
      summary: Get reservations by status (Admin)
      description: |
        Returns reservations filtered by status, such as pending, confirmed, canceled, or expired.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: status
          required: true
          schema:
            type: string
            enum: [pending, confirmed, canceled, expired]
      responses:
        "200":
          description: Reservations filtered by status.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  results:
                    type: integer
                    example: 1
                  data:
                    type: object
                    properties:
                      reservations:
                        type: array
                        items:
                          $ref: "#/components/schemas/Reservation"
        "403":
          description: Forbidden. Admin access required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /reservations/{id}:
    get:
      tags: [Reservation]
      summary: Get reservation by ID
      description: |
        Returns a single reservation by its UUID. The authenticated user can retrieve their own reservation, while admins can access any reservation.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Reservation fetched successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      reservation:
                        $ref: "#/components/schemas/Reservation"
        "401":
          description: Unauthorized.
        "404":
          description: Reservation not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags: [Admin]
      summary: Delete reservation (Admin)
      description: |
        Permanently deletes a reservation record from the system.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Reservation deleted successfully.
        "403":
          description: Forbidden. Admin access required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Reservation not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /reservations/{id}/cancel:
    patch:
      tags: [Reservation]
      summary: Cancel a reservation
      description: |
        Cancels the current user's pending reservation, releases reserved ticket capacity, and updates the reservation status to canceled.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Reservation canceled successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      reservation:
                        $ref: "#/components/schemas/Reservation"
        "400":
          description: Reservation cannot be canceled because it is already canceled, paid, or expired.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized.
        "403":
          description: User is not allowed to cancel this reservation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Reservation not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
