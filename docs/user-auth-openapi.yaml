components:
  schemas:
    User:
      type: object
      required:
        - id
        - fullName
        - email
        - role
      properties:
        id:
          type: string
          format: uuid
          example: 6d10c93f-bf3d-4fa6-ae42-4558742c56df
        fullName:
          type: string
          example: John Doe
        email:
          type: string
          format: email
          example: john@example.com
        role:
          type: string
          enum: [user, admin]
          example: user
        avatar:
          type: string
          format: uri
          nullable: true
          example: https://res.cloudinary.com/demo/image/upload/v123/avatar.jpg
        avatarPublicId:
          type: string
          nullable: true
          example: ticket-express/avatar_123
        createdAt:
          type: string
          format: date-time
          example: 2026-07-17T12:00:00.000Z

    SignupRequest:
      type: object
      required: [fullName, email, password, passwordConfirmation]
      properties:
        fullName:
          type: string
          example: John Doe
        email:
          type: string
          format: email
          example: john@example.com
        password:
          type: string
          format: password
          minLength: 8
          example: StrongP@ssw0rd
        passwordConfirmation:
          type: string
          format: password
          example: StrongP@ssw0rd

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: john@example.com
        password:
          type: string
          format: password
          example: StrongP@ssw0rd

    ForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          example: john@example.com

    ResetPasswordRequest:
      type: object
      required: [password, passwordConfirmation]
      properties:
        password:
          type: string
          format: password
          example: NewStrongP@ssw0rd
        passwordConfirmation:
          type: string
          format: password
          example: NewStrongP@ssw0rd

    UpdateCurrentUserRequest:
      type: object
      properties:
        fullName:
          type: string
          example: Updated Name
        email:
          type: string
          format: email
          example: updated@example.com

    UpdateCurrentUserPasswordRequest:
      type: object
      required: [currentPassword, password, passwordConfirmation]
      properties:
        currentPassword:
          type: string
          format: password
          example: OldStrongP@ssw0rd
        password:
          type: string
          format: password
          example: NewStrongP@ssw0rd
        passwordConfirmation:
          type: string
          format: password
          example: NewStrongP@ssw0rd

    CreateUserByAdminRequest:
      type: object
      required: [fullName, email, password, passwordConfirmation]
      properties:
        fullName:
          type: string
          example: Admin Created User
        email:
          type: string
          format: email
          example: created@example.com
        password:
          type: string
          format: password
          example: StrongP@ssw0rd
        passwordConfirmation:
          type: string
          format: password
          example: StrongP@ssw0rd

    UpdateUserByAdminRequest:
      type: object
      properties:
        fullName:
          type: string
          example: Updated User Name
        email:
          type: string
          format: email
          example: updated.user@example.com
        role:
          type: string
          enum: [user, admin]
          example: user

    AuthSuccessResponse:
      type: object
      required: [status, data]
      properties:
        status:
          type: string
          example: success
        data:
          type: object
          properties:
            user:
              $ref: "#/components/schemas/User"

    UserListResponse:
      type: object
      properties:
        status:
          type: string
          example: success
        results:
          type: integer
          example: 10
        pagination:
          type: object
          nullable: true
        data:
          type: object
          properties:
            users:
              type: array
              items:
                $ref: "#/components/schemas/User"

    ErrorResponse:
      type: object
      required: [status, errors]
      properties:
        status:
          type: string
          example: error

        errors:
          type: array
          items:
            type: object
            required: [message]
            properties:
              field:
                type: string
                nullable: true
                example: null

              message:
                type: string
                example: Something went wrong.

paths:
  /users/signup:
    post:
      tags: [Authentication]
      summary: Register a new user
      description: |
        Creates a new user account. On success, an access token and refresh token are generated and returned through cookies and the response header.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupRequest"
      responses:
        "201":
          description: Registration completed successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSuccessResponse"
        "400":
          description: Invalid input or validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Email already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /users/login:
    post:
      tags: [Authentication]
      summary: Log in a user
      description: |
        Authenticates a user using email and password. On success, new authentication tokens are issued.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSuccessResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /users/logout:
    post:
      tags: [Authentication]
      summary: Log out the current user
      description: |
        Clears the current user's refresh token and removes the related authentication cookies.
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Logout successful
        "401":
          description: Unauthorized

  /users/refresh-token:
    post:
      tags: [Authentication]
      summary: Refresh access token
      description: |
        Generates a new access token using the refresh token stored in the cookie.
      parameters:
        - in: cookie
          name: refreshToken
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Access token refreshed successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSuccessResponse"
        "401":
          description: Invalid or expired or not provided refresh token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /users/forgot-password:
    post:
      tags: [Authentication]
      summary: Request password reset
      description: |
        Sends a password reset link to the user. If the email delivery fails, the reset token is cleared and a server error is returned.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordRequest"
      responses:
        "200":
          description: Password reset email sent successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Password recovery email sent successfully
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: There was an error sending the email
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /users/reset-password:
    patch:
      tags: [Authentication]
      summary: Reset password with token
      description: |
        Updates the user's password using the reset token passed in the query string and issues fresh tokens afterward.
      parameters:
        - in: query
          name: resetToken
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "200":
          description: Password reset successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSuccessResponse"
        "401":
          description: Invalid or expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /users/me:
    get:
      tags: [User]
      summary: Get the current authenticated user
      description: |
        Returns the authenticated user's profile information from req.user.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user fetched successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      currentUser:
                        $ref: "#/components/schemas/User"
        "401":
          description: Unauthorized
    patch:
      tags: [User]
      summary: Update the current user profile
      description: |
        Allows the authenticated user to update fullName and email. If password is sent in this request, an UnprocessableEntityError is thrown.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCurrentUserRequest"
      responses:
        "200":
          description: Profile updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      updatedUser:
                        $ref: "#/components/schemas/User"
        "401":
          description: Unauthorized

        "422":
          description: Wrong requests
    delete:
      tags: [User]
      summary: Delete the current user account
      description: |
        Deletes the authenticated user's own account.
      security:
        - bearerAuth: []
      responses:
        "204":
          description: User account deleted successfully
        "401":
          description: Unauthorized

  /users/me/update-password:
    patch:
      tags: [User]
      summary: Change the current user's password
      description: |
        Verifies the current password, updates the new password on the user model, and issues fresh tokens afterward.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCurrentUserPasswordRequest"
      responses:
        "200":
          description: Password updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSuccessResponse"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Current password is incorrect
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: New password and confirmation do not match
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /users/avatar:
    patch:
      tags: [User]
      summary: Upload a user avatar
      description: |
        Uploads the avatar image to Cloudinary and stores the resulting URL and public_id on the user.
        If an existing avatar is present, it is removed first.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [avatar]
              properties:
                avatar:
                  type: string
                  format: binary
      responses:
        "200":
          description: Avatar uploaded successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      user:
                        $ref: "#/components/schemas/User"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized

  /users:
    get:
      tags: [Admin]
      summary: Get all users
      description: |
        Admin-only endpoint. Returns a paginated list of users.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Users list fetched successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserListResponse"
        "403":
          description: Access forbidden
        "404":
          description: page does not exist
    post:
      tags: [Admin]
      summary: Create a user by admin
      description: |
        Creates a new user from the admin panel.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserByAdminRequest"
      responses:
        "201":
          description: User created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      user:
                        $ref: "#/components/schemas/User"

  /users/get-daily-users-count:
    get:
      tags: [Admin]
      summary: Get daily user registration count
      description: |
        Returns daily registration statistics for the admin dashboard. Supports an optional date range through query parameters.
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: startDate
          schema:
            type: string
            format: date
        - in: query
          name: endDate
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Daily statistics returned successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  results:
                    type: integer
                  data:
                    type: object
                    properties:
                      results:
                        type: array
                        items:
                          type: object
                          additionalProperties: true

  /users/{id}:
    get:
      tags: [Admin]
      summary: Get a user by ID
      description: |
        Retrieves a single user record for administrative access.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: User fetched successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      user:
                        $ref: "#/components/schemas/User"
        "404":
          description: User not found
    patch:
      tags: [Admin]
      summary: Update a user by admin
      description: |
        Allows an admin to update another user's information.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserByAdminRequest"
      responses:
        "200":
          description: User updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      user:
                        $ref: "#/components/schemas/User"
    delete:
      tags: [Admin]
      summary: Delete a user by admin
      description: |
        Deletes another user account from the admin panel. Deleting admin accounts is not allowed.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: User deleted successfully
        "403":
          description: Forbidden
